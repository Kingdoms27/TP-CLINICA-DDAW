name: Verificar clínica
on: [push, pull_request]
jobs:
  pruebas:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_DB: clinica_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DB_HOST: 127.0.0.1
      DB_PORT: 5432
      DB_USERNAME: postgres
      DB_PASSWORD: postgres
      DB_DATABASE: clinica_test
      DB_SYNCHRONIZE: 'true'
      JWT_SECRET: secreto-exclusivo-de-ci
      TZ: America/Argentina/Buenos_Aires
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci
        working-directory: backend
      - run: npm run build
        working-directory: backend
      - run: npm test -- --runInBand
        working-directory: backend
      - run: npm run test:e2e
        working-directory: backend
      - run: npm ci
        working-directory: frontend
      - run: npm test -- --watch=false
        working-directory: frontend
      - run: npm run build
        working-directory: frontend
      - run: npm run docs
        working-directory: frontend
      - name: Preparar nginx y PM2
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y nginx
          npm run seed --prefix backend
          npm run pm2:start --prefix backend
          node deploy/generar-nginx.cjs
          nginx -p "${{ github.workspace }}/deploy/runtime/" -c nginx.conf -t
          nginx -p "${{ github.workspace }}/deploy/runtime/" -c nginx.conf
      - name: Probar el stack servido por nginx
        run: |
          for i in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:8080/api/ > /dev/null; then break; fi
            sleep 1
          done
          node deploy/probar-stack.cjs
      - name: Detener procesos de prueba
        if: always()
        run: |
          nginx -p "${{ github.workspace }}/deploy/runtime/" -c nginx.conf -s quit || true
          npm run pm2:stop --prefix backend || true

name: Limpieza puntual de capturas antiguas de Clinica

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/cleanup-old-previews.yml"

permissions:
  contents: read
  actions: write

jobs:
  conservar-tres-capturas:
    runs-on: ubuntu-latest
    steps:
      - name: Conservar las 3 mas recientes y eliminar las antiguas
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          entries=$(mktemp)
          keep=$(mktemp)
          gh api --paginate 'repos/Kingdoms27/TP-CLINICA-DDAW/actions/artifacts?per_page=100' --jq '.artifacts[] | select(.name == "vistas-clinica" and .expired == false) | [.created_at, (.id|tostring)] | @tsv' | sort -r > "$entries"
          if ! cut -f2 "$entries" | grep -qx '11519590688'; then
            echo '::error::No se encuentra la ultima captura conocida. No se elimina nada.'
            exit 1
          fi
          head -n 3 "$entries" | cut -f2 > "$keep"
          printf '%s\n' '11519590688' >> "$keep"
          count=0
          while IFS=$'\t' read -r created id; do
            if grep -qx "$id" "$keep"; then
              echo "Conservando captura $id ($created)"
              continue
            fi
            echo "Eliminando captura antigua $id ($created)"
            gh api --method DELETE "repos/Kingdoms27/TP-CLINICA-DDAW/actions/artifacts/$id"
            count=$((count + 1))
          done < "$entries"
          echo "Capturas antiguas eliminadas: $count"
